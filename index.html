<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Builder · Llihc</title>
    <meta name="description" content="Plan Wuthering Waves teams and export them as an image." />
    <meta name="theme-color" content="#efe8e2" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
      // Theme before first paint (see src/lib/theme.ts): saved choice, else the system setting.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem('wtb:theme');
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
